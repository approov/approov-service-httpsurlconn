plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

repositories {
    mavenCentral()
    google()
}

group = 'com.github.approov'

android {
    namespace = 'io.approov.service.httpsurlconn'
    compileSdkVersion 30

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = false
    }

    sourceSets {
        test {
            java {
                if (findProject(':approov-sdk') == null || findProject(':test-support') == null) {
                    exclude '**/ApproovServiceMiniSdkTest.java'
                    exclude '**/ApproovNativeSdkTest.java'
                }
            }
        }
    }
}

configurations {
    shadowed

    // mini-sdk integration tests use the test-support :approov-sdk stub, so keep the real
    // closed-source SDK off the test classpath to avoid a clash.
    testImplementation {
        exclude group: 'io.approov', module: 'approov-android-sdk'
    }
}

// Shade + relocate BouncyCastle into a layer-private namespace so it is not exposed as a
// dependency and cannot clash with an app's own copy. Note the intermediate `httpsurlconn`
// segment (TESTING_REQUIREMENTS §9.2). bcprov is declared in the `shadowed` config (not
// implementation), removing it from the published POM.
tasks.register('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier.set('shadow')
    configurations = [project.configurations.shadowed]
    relocate 'org.bouncycastle', 'io.approov.internal.httpsurlconn.bouncycastle'
    exclude 'META-INF/**'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.approov:approov-android-sdk:3.5.1'

    // Bouncycastle for ASN.1 parsing — shaded/relocated into io.approov.internal.httpsurlconn.bouncycastle
    shadowed 'org.bouncycastle:bcprov-jdk15to18:1.84'
    compileOnly files(tasks.named('shadowJar'))
    implementation files(tasks.named('shadowJar'))

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    if (findProject(':approov-sdk') != null) {
        testImplementation project(':approov-sdk')
    }
    if (findProject(':test-support') != null) {
        testImplementation project(':test-support')
    }
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.json:json:20231013'
    testImplementation 'androidx.test:core:1.6.1'
}

tasks.withType(JavaCompile) {
    dependsOn tasks.named('shadowJar')
}
